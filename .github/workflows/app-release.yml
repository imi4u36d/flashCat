name: App Release

# 四端安装包。触发方式：
#   - workflow_dispatch：手动跑一次，产物在 Actions 的 artifacts 里；
#   - 打 tag `app-v0.2.0`：同时把安装包挂到 GitHub Release。
#
# Windows 只能在 windows runner 上构建（Tauri 不支持从 macOS 交叉编译），
# iOS 的真机包需要签名证书与描述文件，这里默认产出模拟器包 + 无签名校验构建。

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS
            args: --target universal-apple-darwin
          - os: windows-2025
            label: Windows
            args: ""
          - os: ubuntu-24.04
            label: Linux
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      # tauri-action 会跑 beforeBuildCommand、打包并按需创建 release。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('FlashCat {0}', github.ref_name) || '' }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: flashcat-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            web/src-tauri/target/**/bundle/dmg/*.dmg
            web/src-tauri/target/**/bundle/macos/*.app
            web/src-tauri/target/**/bundle/nsis/*.exe
            web/src-tauri/target/**/bundle/msi/*.msi
            web/src-tauri/target/**/bundle/deb/*.deb
            web/src-tauri/target/**/bundle/appimage/*.AppImage

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: sdkmanager "ndk;29.0.14206865"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      # 默认出 debug APK（用 debug 证书签名，可直接 adb install）。
      # 要出正式包，在仓库 secrets 里配 ANDROID_KEYSTORE 等，再改成 --release。
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: pnpm tauri android build --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: flashcat-android
          if-no-files-found: error
          path: web/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      - name: Init iOS project
        run: pnpm tauri ios init

      # 模拟器包不需要签名，用来验证编译链；真机包要在有证书的环境里跑
      # `pnpm tauri ios build --export-method development`。
      - name: Build (simulator)
        run: pnpm tauri ios build --debug --target aarch64-sim

      - uses: actions/upload-artifact@v4
        with:
          name: flashcat-ios-simulator
          if-no-files-found: warn
          path: web/src-tauri/gen/apple/build/**/*.app
