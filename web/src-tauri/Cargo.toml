[package]
name = "flashcat"
version = "0.3.4"
description = "FlashCat — local inference workbench"
authors = ["FlashCat"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# staticlib/cdylib 是 iOS / Android 需要的产物形态，桌面端只用 rlib。
name = "flashcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 默认带真推理；没有 LLVM/CMake 的机器可以用
#   pnpm tauri build -- --no-default-features
# 出一份只有演示后端的包（UI/打包链路仍然完整，方便先验证平台）。
default = ["llama"]
llama = ["dep:llama-cpp-2"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.2.1"
# 按目标平台选编译选项：apple 走 Metal（GPU），其它先用纯 CPU。
# 不开 openmp：Android NDK 的 libomp 要额外分发，收益也比不上单机多线程。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"], optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, optional = true }


[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
# 移动端目前不需要额外依赖；本地推理后端接入时在这里挂 llama.cpp 绑定。

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
