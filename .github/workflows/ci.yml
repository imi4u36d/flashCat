name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  # Hard gate. These three must stay green from now on.
  build-and-test:
    # Must be >= the floor in native/Package.swift (`platforms: [.macOS("26.0")]`).
    # The runner still needs the macOS 27 SDK to compile the macOS 27-only
    # `.tabs` segmented style; it is availability-guarded at runtime.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # 基线已经收到 0：11 条历史告警在这轮里逐条修掉了（TailReader 的缓冲区
      # 变成加锁的引用类型、ChatClient 改为每请求一份状态、滑杆读数改用本地
      # @State），所以这一项现在是零点检查——再多出一条就是新债。
      - name: Strict concurrency must not regress
        run: |
          set -o pipefail
          swift build -Xswiftc -strict-concurrency=complete 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee /tmp/concurrency.log
          baseline="$(cat .strict-concurrency-baseline)"
          count="$(grep -oE '\.swift:[0-9]+:[0-9]+: warning:' /tmp/concurrency.log | sort -u | wc -l | tr -d ' ')"
          echo "strict-concurrency warnings: $count (baseline $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::strict-concurrency warnings rose to $count (baseline $baseline)"
            exit 1
          fi

      - name: Test
        run: swift test

  version-consistency:
    # The release that ships must agree with the tag that names it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: VERSION matches the tag
        run: |
          file_version="$(./scripts/version.sh)"
          echo "VERSION=$file_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$file_version" != "$tag_version" ]]; then
              echo "::error::VERSION ($file_version) != tag ($tag_version)"
              exit 1
            fi
          fi

  # Advisory for now. Phase 2 of the roadmap turns these into hard gates once
  # the lint baseline files exist.
  lint:
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - name: SwiftLint
        working-directory: native
        run: |
          if [ -f .swiftlint.baseline.json ]; then
            swiftlint --baseline .swiftlint.baseline.json
          else
            swiftlint
          fi

  format:
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install swift-format
      - name: swift-format
        working-directory: native
        run: swift-format lint --recursive Sources Tests
