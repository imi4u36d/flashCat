name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  # Hard gate. These three must stay green from now on.
  build-and-test:
    # Must be >= the floor in native/Package.swift (`platforms: [.macOS("26.0")]`).
    # The runner still needs the macOS 27 SDK to compile the macOS 27-only
    # `.tabs` segmented style; it is availability-guarded at runtime.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # Fail fast: script syntax, Python syntax and the pack scaffolding's stub
      # tests run here, before the ten-minute Swift build. bash -n uses the
      # runner's /bin/bash (3.2 on macOS), which is the runtime the scripts
      # actually see, so anything bash-4-only shows up now instead of on release
      # day.
      - name: Script syntax and pack self-test
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob
          total=0
          for script in scripts/*.sh scripts/engines/*.sh; do
            bash -n "$script"
            total=$((total + 1))
          done
          echo "bash -n: $total scripts OK"
          # py_compile writes __pycache__ next to the sources (it is
          # gitignored); remove it so later steps see a clean tree.
          python3 -m py_compile runtime/*.py
          rm -rf runtime/__pycache__
          # The five build-*-pack.sh scripts share lib-pack.sh; the stub tests
          # cover staging + swap, --dry-run, and "a failed rebuild keeps the
          # installed pack". No network, no engine toolchain required.
          bash scripts/engines/lib-pack-selftest.sh

      # 分层规则的机器守卫：Core/ 不得 import UI 框架或引用装配根，
      # AppState 不得越过行数预算，UI 不得出现 $state. 双向绑定。
      # 规则在 scripts/check-architecture.sh 里，新增例外必须写在脚本里并注明原因。
      - name: Architecture guard
        working-directory: .
        run: bash scripts/check-architecture.sh

      - name: Toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # 基线已经收到 0：11 条历史告警在这轮里逐条修掉了（TailReader 的缓冲区
      # 变成加锁的引用类型、ChatClient 改为每请求一份状态、滑杆读数改用本地
      # @State），所以这一项现在是零点检查——再多出一条就是新债。
      # 刻意保留成单独一步，不和上面那次构建合并：合并就要加 -warnings-as-errors，
      # 那样 strict-concurrency 的告警会以 `error:` 输出，下面的 grep 永远数到 0
      # 条，基线常绿、棘轮静默失效。改用独立 scratch path：既不动 swift test 要
      # 复用的 .build（少两轮全量编译），又是干净的全量构建，不会靠复用旧目标
      # 文件漏报新告警（.build-sc/ 已在 .gitignore 里）。
      - name: Strict concurrency must not regress
        run: |
          set -o pipefail
          swift build -Xswiftc -strict-concurrency=complete \
            --scratch-path .build-sc/strict-concurrency 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee /tmp/concurrency.log
          baseline="$(cat .strict-concurrency-baseline)"
          # 基线已经收到 0，所以「一条都没匹配到」是正常且期望的结果。但 grep
          # 无匹配时退出码是 1，pipefail 会把整条命令替换判成失败，bash -e 直接
          # 退出——连下面那行读数都打不出来。`|| true` 只兜这个分支，读数照常
          # 比较；真出现新告警时 grep 返回 0，count 仍然正确。
          count="$(grep -oE '\.swift:[0-9]+:[0-9]+: warning:' /tmp/concurrency.log \
            | sort -u | wc -l | tr -d ' ' || true)"
          echo "strict-concurrency warnings: $count (baseline $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::strict-concurrency warnings rose to $count (baseline $baseline)"
            exit 1
          fi

      - name: Test
        run: swift test

      # Core domain（去掉进程/安装驱动）≥ 60%，FlashCatKit ≥ 80%。
      # 这两个门槛由 scripts/coverage.sh 计算并打印，低于门槛直接失败。
      - name: Coverage gates
        working-directory: .
        run: bash scripts/coverage.sh

  version-consistency:
    # The release that ships must agree with the tag that names it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: VERSION matches the tag
        run: |
          file_version="$(./scripts/version.sh)"
          echo "VERSION=$file_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$file_version" != "$tag_version" ]]; then
              echo "::error::VERSION ($file_version) != tag ($tag_version)"
              exit 1
            fi
          fi

  # Advisory for now: SwiftLint 的语义规则（命名、复杂度）还没形成基线文件，
  # 升成硬门禁之前得先有人把现有告警收干净。格式门禁已经是硬的，见下面 format。
  lint:
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - name: SwiftLint
        working-directory: native
        run: |
          if [ -f .swiftlint.baseline.json ]; then
            swiftlint --baseline .swiftlint.baseline.json
          else
            swiftlint
          fi

  # 硬门禁：11-16 那轮把全仓按 native/.swift-format 格式化了一遍，lint 输出
  # 从 7348 条收到 0，所以这里可以 --strict（有任何一条就失败）。用工具链自带的
  # `swift format` 而不是 brew 的 swift-format：版本跟构建用的工具链一致，不会
  # 出现本地过、CI 因为多了几条新规则而红的假失败。
  format:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: swift format lint (strict)
        working-directory: native
        run: swift format lint --strict --recursive Sources Tests
