<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<!--
  The console is a local, fully bundled page: it loads no remote resource and
  makes no network request (Swift owns every fetch). Locking that down means an
  injected snippet has no exfiltration path, and `connect-src 'none'` makes the
  guarantee machine-checked rather than a convention.
  `file:` is listed explicitly because WebKit treats each file:// document as
  its own origin, so `'self'` alone does not cover the sibling assets.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>flashCat</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="model-workspace.css">
<link rel="stylesheet" href="engine-workspace.css">
<link rel="stylesheet" href="chat-thinking.css">
<link rel="stylesheet" href="overlay-bounds.css">
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="opaque-surfaces.css">
<link rel="stylesheet" href="chat-stream.css">
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="desktop-grain" aria-hidden="true"></div>

  <section class="window" id="window" aria-label="flashCat">
    <div class="window-sheen" aria-hidden="true"></div>
    <header class="titlebar" data-drag-region>
      <span class="traffic-spacer" aria-hidden="true"></span>

      <button class="sidebar-toggle" id="sidebarToggle" type="button"
              aria-label="折叠边栏" aria-expanded="true" title="折叠边栏（⌘\）">
        <span class="sidebar-toggle-glyph" aria-hidden="true"></span>
      </button>

      <button class="top-engine-control" id="topEngineControl" type="button"
              data-action="toggle-engine" aria-label="停止引擎">
        <span class="top-engine-dot" id="topEngineDot"></span>
        <strong id="topEngineName">Splash</strong>
        <span id="topEngineState">运行中</span>
        <span class="top-engine-divider"></span>
        <b id="topEngineRate">104 tok/s</b>
        <span class="top-engine-action" id="topEngineAction"></span>
      </button>

      <div class="toolbar-actions">
        <button class="glass-icon-btn" id="themeToggle" type="button"
                aria-label="切换浅色外观" title="切换外观">
          <span id="themeIcon"></span>
        </button>
        <button class="glass-icon-btn" id="downloadShortcut" type="button"
                aria-label="打开下载中心" title="下载中心">
          <span id="downloadIcon"></span>
          <span class="icon-badge" id="downloadBadge">0</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <header class="sidebar-brand">
          <div class="brand-icon-wrap">
            <img src="app-icon.png" alt="" class="brand-icon">
            <span class="brand-live" aria-hidden="true"></span>
          </div>
        </header>

        <nav class="primary-nav" id="primaryNav" aria-label="工作区"></nav>

        <section class="sidebar-recents" id="sidebarRecents" aria-label="最近对话">
          <div class="sidebar-heading">最近对话</div>
          <div class="recent-list" id="recentList"></div>
        </section>

        <span class="sidebar-spacer" aria-hidden="true"></span>

        <hr class="sidebar-resize" id="sidebarResize" role="separator"
            aria-orientation="vertical" aria-label="调整侧边栏宽度"
            aria-valuemin="72" aria-valuemax="320" aria-valuenow="200" tabindex="0">
      </aside>

      <main class="content-shell" id="mainContent" tabindex="-1">
        <div class="page-frame" id="pageFrame"></div>
      </main>
    </div>
  </section>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

  <div class="overlay-layer" id="overlayLayer" aria-hidden="true">
    <div class="command-backdrop" data-close-command></div>
    <section class="command-palette glass-sheet" id="commandPalette" role="dialog"
             aria-modal="true" aria-labelledby="commandTitle">
      <header class="command-head">
        <span class="command-icon" id="commandIcon"></span>
        <label class="visually-hidden" for="commandInput">搜索页面或命令</label>
        <input id="commandInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="跳转到页面或执行命令…">
        <kbd>esc</kbd>
      </header>
      <div class="command-results" id="commandResults"></div>
      <footer class="command-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>↵</kbd> 打开</span>
        <span class="command-hint" id="commandHint">6 个工作区可用</span>
      </footer>
    </section>

    <section class="inspector glass-sheet" id="inspector" role="dialog" aria-modal="false"
             aria-labelledby="inspectorTitle">
      <div class="inspector-grabber" aria-hidden="true"></div>
      <header class="inspector-head">
        <div>
          <span class="eyebrow">CHAT PARAMETERS</span>
          <h2 id="inspectorTitle">生成参数</h2>
        </div>
        <button class="glass-icon-btn small" type="button" data-close-inspector
                aria-label="关闭参数面板"><span class="sr-only">关闭参数面板</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </header>
      <div class="inspector-body"></div>
    </section>

    <section class="download-sheet glass-sheet" id="downloadSheet" role="dialog" aria-modal="false"
             aria-labelledby="downloadTitle">
      <header class="sheet-head">
        <div>
          <span class="eyebrow">MODEL DOWNLOADS</span>
          <h2 id="downloadTitle">下载中心</h2>
        </div>
        <button class="glass-icon-btn small" type="button" data-close-downloads
                aria-label="关闭下载中心"><span class="sr-only">关闭下载中心</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </header>
      <div class="download-list" id="downloadList"></div>
    </section>

    <section class="model-popover glass-sheet" id="modelPopover" role="menu"
             aria-label="选择模型"></section>
  </div>

  <!-- 构建产物：14 个 ES module 由 `make webui-build`（esbuild）打包成单文件。
       不能改回多个 <script type="module">：file:// 下 WebKit 会因 CORS 拒绝
       外链 module 脚本（已用 WKWebView 探针实证），必须打包成经典脚本。 -->
  <script src="bundle.js"></script>
</body>
</html>
